name: Falix Keeper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Falix Keeper
        env:
          FALIX_API_KEY: ${{ secrets.FALIX_API_KEY }}
          FALIX_API_KEY_2: ${{ secrets.FALIX_API_KEY_2 }}
        run: python -u falix_keeper.py
