name: Mantener servidor Falix comprobado

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: falix-server-check
  cancel-in-progress: false

jobs:
  check-server:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Comprobar y arrancar servidor
        env:
          FALIX_API_KEY: ${{ secrets.FALIX_API_KEY }}
          FALIX_SERVER_ID: ${{ vars.FALIX_SERVER_ID }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error

          BASE = "https://client.falixnodes.net/api/v2"
          KEY = os.environ["FALIX_API_KEY"]
          SID = os.environ["FALIX_SERVER_ID"]

          HEADERS = {
              "Authorization": f"Bearer {KEY}",
              "Content-Type": "application/json"
          }

          def api(path, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  BASE + path,
                  data=data,
                  headers=HEADERS,
                  method=method
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  raw = e.read().decode(errors="replace")
                  try:
                      result = json.loads(raw)
                  except Exception:
                      result = {"error": {"message": raw}}
                  return e.code, result

          def get_state():
              code, result = api(f"/servers/{SID}/console/status")
              if code != 200:
                  raise RuntimeError(f"No pude consultar el estado: {result}")

              data = result.get("data", {})
              status = str(data.get("status", "unknown")).lower()

              _, storage_result = api(
                  f"/servers/{SID}/console/storage"
              )
              storage_data = storage_result.get("data", {})
              in_storage = (
                  storage_data.get("status") == "storage"
                  or storage_data.get("storage_mode") is True
                  or data.get("is_storage_node") is True
              )

              _, queue_result = api(
                  f"/servers/{SID}/console/queue-status"
              )
              queue_data = queue_result.get("data", {})
              queued = queue_data.get("queued") is True

              print(
                  f"Estado={status}; almacenamiento={in_storage}; "
                  f"en_cola={queued}"
              )
              return status, in_storage, queued

          started = False

          # Revisar durante un máximo de 8 minutos en esta ejecución.
          for attempt in range(5):
              status, in_storage, queued = get_state()

              if status in ("running", "online"):
                  print("Servidor encendido. No hago nada más.")
                  break

              if in_storage:
                  print("Modo almacenamiento: no envío orden de inicio.")

              elif queued:
                  print("Servidor en cola: no envío otra orden de inicio.")

              elif status in ("offline", "stopped"):
                  if not started:
                      code, result = api(
                          f"/servers/{SID}/power",
                          method="POST",
                          body={"signal": "start"}
                      )

                      if code in (200, 202):
                          print("Orden de inicio enviada.")
                          started = True
                      else:
                          error = result.get("error", {})
                          print("No se pudo iniciar:", error)

                          if error.get("code") == "verification_required":
                              print(
                                  "Debes completar la verificación de Falix "
                                  "manualmente mediante el enlace indicado "
                                  "por Falix."
                              )
                              if error.get("action_url"):
                                  print(error["action_url"])
                              break

                          if code in (409, 429, 503):
                              print("Falix no acepta el inicio ahora.")
                          else:
                              raise RuntimeError(
                                  "Error al iniciar el servidor."
                              )
              else:
                  print("Estado no reconocido; no envío órdenes.")

              if attempt < 4:
                  print("Volveré a comprobar en 2 minutos.")
                  time.sleep(120)

          print("Fin de esta comprobación.")
          PY
